name: Check website

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - docs/**
      - commit-changes/**
  pull_request:
    paths-ignore:
      - README.md
      - docs/**
      - commit-changes/**

permissions:
  contents: read

concurrency:
  group: check-website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format checkout
        run: npm run format
      - name: Check lint, types and build
        run: npm run check:quick
      - name: Run browser smoke tests
        if: github.event_name == 'pull_request'
        run: npm run test:smoke
      - name: Run full browser tests
        if: github.event_name == 'push'
        run: npm test
      - name: Deploy tested website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: browser-failure-evidence
          path: artifacts/test-results
          if-no-files-found: ignore
